<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>MarinaLog - Comando Tattico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Montserrat', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              navy: {
                700: '#1e3a5f',
                800: '#1a3a52',
                900: '#0f172a',
                950: '#020617',
              },
              gold: {
                400: '#FFA500',
                500: '#F59E0B',
                600: '#D97706',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-alert': 'pulseAlert 2s infinite',
              'radar-sweep': 'radarSweep 10s linear infinite', // Nuovo: per l'effetto radar
              'logo-float': 'logoFloatMega 6s ease-in-out infinite',
              'glow-breathe': 'glowBreathe 4s ease-in-out infinite',
              'fill-progress': 'fillProgress 1.5s ease-out forwards', // Nuovo: per le barre di progresso
              'scan-line': 'scan-line 1.5s linear infinite', // Nuovo: per la scansione IA
              'pulse-gold': 'pulse-gold 2s infinite', // Nuovo: per il glow tattico
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { transform: 'translateY(30px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              pulseAlert: { '0%, 100%': { transform: 'scale(1)', opacity: '1' }, '50%': { transform: 'scale(1.05)', opacity: '0.8' } },
              radarPulse: { '0%': { transform: 'scale(0.8)', opacity: '0.5' }, '100%': { transform: 'scale(3)', opacity: '0' } },
              logoFloatMega: { '0%, 100%': { transform: 'translateY(0) rotate(0deg) scale(1)' }, '50%': { transform: 'translateY(-25px) rotate(3deg) scale(1.05)' } },
              glowBreathe: { '0%, 100%': { opacity: '0.3', transform: 'scale(1)' }, '50%': { opacity: '0.6', transform: 'scale(1.2)' } },
              radarSweep: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },
              fillProgress: { '0%': { width: '0%' }, '100%': { width: 'var(--progress-width)' } },
              'scan-line': { 
                '0%': { transform: 'translateX(-100%)' }, 
                '100%': { transform: 'translateX(100%)' } 
              },
              'pulse-gold': {
                '0%, 100%': { 'box-shadow': '0 0 0 0 rgba(245, 158, 11, 0.7)' },
                '50%': { 'box-shadow': '0 0 10px 5px rgba(245, 158, 11, 0.4)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }
      
      body {
        background-color: #020617;
        color: white;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Inter', sans-serif;
        overscroll-behavior-y: none; /* Previene il rimbalzo su iOS per un look più app */
      }
      
      .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 1rem); }
      .pt-safe { padding-top: env(safe-area-inset-top); }

      /* LOGO GIGANTE E OLOGRAFICO */
      .mega-logo-container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin: 20px 0;
      }

      .logo-main-visual {
        width: 300px; /* Molto più grande */
        height: auto;
        filter: drop-shadow(0 0 40px rgba(34, 211, 238, 0.7));
        animation: logoFloatMega 6s ease-in-out infinite;
        z-index: 10;
      }

      @media (max-width: 390px) {
        .logo-main-visual {
          width: 260px; /* Ottimizzato per iPhone più piccoli */
        }
      }

      .hologram-backlight {
        position: absolute;
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
        border-radius: 50%;
        animation: glowBreathe 4s ease-in-out infinite;
        z-index: 1;
      }

      .font-tactical {
        font-family: 'JetBrains Mono', monospace;
        letter-spacing: -0.05em;
      }

      .ios-tab-bar {
        background: rgba(2, 6, 23, 0.85);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-top: 0.5px solid rgba(255, 255, 255, 0.1);
      }

      .ios-card {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* NUOVI STILI VISIVI */
      
      /* Sfondo con gradiente e effetto radar */
      .background-sweep {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, rgba(2, 6, 23, 1) 70%);
        z-index: 0;
        pointer-events: none;
      }

      .radar-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(90deg, rgba(59, 130, 246, 0) 0%, rgba(59, 130, 246, 0.05) 50%, rgba(59, 130, 246, 0) 100%);
        opacity: 0.1;
        transform-origin: 0% 0%;
        animation: radarSweep 10s linear infinite;
      }

      /* Hover 3D Card Effect */
      .hover-3d {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .hover-3d:hover {
        transform: translateY(-5px) scale(1.01);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.2);
      }

      /* Rimuove scrollbar su mobile */
      ::-webkit-scrollbar { display: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "recharts": "https://esm.sh/recharts@^3.6.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="pt-safe select-none">
    <div class="background-sweep">
        <div class="radar-overlay"></div>
    </div>
    <div id="root" class="relative z-10"></div>
        <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
